# Alembic CLI configuration. The database URL is not set here: env.py reads DATABASE_URL from the
# application settings (and .env), so the CLI migrates the same database the API uses.
#
#   alembic upgrade head                                  apply every pending migration
#   alembic revision --autogenerate -m "add conversations"  draft a migration from model changes
#   alembic current                                       show the database's revision

[alembic]
script_location = app/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
